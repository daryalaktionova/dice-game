
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101713">

    <title>Проверь свою Судьбу</title>
    <link rel="icon" type="image/png" href="./images/favicon.png">

    <!-- Шрифт Cormorant -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="game">
        <img class="background" src="images/background.png" alt="">
        <img class="arch" src="images/arch.png" alt="">

        <section class="content">
            <h1>Проверь свою Судьбу</h1>

            <!-- Переключатели музыки и звуковых эффектов -->
            <div class="audio-controls">
                <button
                    id="music-toggle"
                    class="sound-toggle"
                    aria-label="Выключить музыку"
                    type="button"
                    aria-pressed="true"
                >
                    <svg
                        id="music-icon"
                        viewBox="0 0 24 24"
                        width="26"
                        height="26"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M9 18V5l12-2v13"/>
                        <circle cx="6" cy="18" r="3"/>
                        <circle cx="18" cy="16" r="3"/>
                    </svg>
                </button>

                <button
                    id="effects-toggle"
                    class="sound-toggle"
                    aria-label="Выключить звуковые эффекты"
                    type="button"
                    aria-pressed="true"
                >
                    <svg
                        id="effects-icon"
                        viewBox="0 0 24 24"
                        width="26"
                        height="26"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
                        <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                        <path d="M19 5a10 10 0 0 1 0 14"/>
                    </svg>
                </button>
            </div>

            <!-- Пространство для трёхмерного кубика -->
            <div class="dice-space" id="dice-space"></div>

            <!-- Результат броска -->
            <p id="result" aria-live="polite">
                Твоя судьба ждёт броска...
            </p>

            <button id="roll" type="button">БРОСИТЬ</button>

            <!-- Выбор внешнего вида кубика -->
            <div
                class="skin-picker"
                role="group"
                aria-label="Выбор внешнего вида кубика"
            >
                <button
                    class="skin-option active"
                    data-skin="0"
                    aria-label="Звёздный артефакт"
                    aria-pressed="true"
                    type="button"
                >
                    <img
                        class="skin-preview"
                        src="images/preview-cosmic.png"
                        alt=""
                    >
                </button>

                <button
                    class="skin-option"
                    data-skin="1"
                    aria-label="Золото алхимиков"
                    aria-pressed="false"
                    type="button"
                >
                    <img
                        class="skin-preview"
                        src="images/preview-gold.png"
                        alt=""
                    >
                </button>

                <button
                    class="skin-option"
                    data-skin="2"
                    aria-label="Адский обсидиан"
                    aria-pressed="false"
                    type="button"
                >
                    <img
                        class="skin-preview"
                        src="images/preview-infernal.png"
                        alt=""
                    >
                </button>
            </div>
        </section>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
